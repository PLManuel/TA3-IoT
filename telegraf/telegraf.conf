[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://emqx:1883"]
  topics = ["iot/raspberrypi/temperatura"]
  qos = 1
  client_id = "telegraf-ta3"

  data_format = "json"
  name_override = "dht22"
  tag_keys = ["sensor", "ubicacion"]
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05Z07:00"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"
